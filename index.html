<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<title>El Retorno · WhatsApp</title>
<style>
  :root {
    --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: #ffffff;
    --green: #25d366; --green-press: #1fb457; --on-green: #062b15;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0d10; --fg: #f5f5f7; --muted: #a1a1a6; --card: #16191d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 100%/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 24px 16px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--card); border-radius: 28px; padding: 36px 24px 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px rgba(0,0,0,.08);
    animation: enter 320ms var(--ease-out) both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  .brand { font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
  .icon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 18px; background: var(--green); display: grid; place-items: center; }
  h1 { font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; }
  p.sub { margin: 0 0 28px; color: var(--muted); font-size: .9375rem; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 56px; border-radius: 16px;
    background: var(--green); color: var(--on-green);
    font-weight: 700; font-size: 1.0625rem; text-decoration: none;
    -webkit-tap-highlight-color: transparent; user-select: none;
    transition: transform 140ms var(--ease-out), background-color 140ms ease;
  }
  .btn:active { transform: scale(0.97); background: var(--green-press); }
  .alt { display: inline-block; margin-top: 18px; color: var(--muted); font-size: .875rem; text-decoration: underline; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    main { animation: fade 200ms ease both; }
    .btn { transition: background-color 140ms ease; }
    .btn:active { transform: none; }
  }
  @keyframes fade { from { opacity: 0; } }
</style>
</head>
<body>
<main>
  <p class="brand">El Retorno · Motores</p>
  <div class="icon" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>
  </div>
  <h1>Abriendo WhatsApp…</h1>
  <p class="sub">Si no se abre solo, toca el botón.</p>
  <a class="btn" id="go" href="https://wa.me/523334864078">Abrir WhatsApp</a>
  <a class="alt" id="web" href="https://wa.me/523334864078">¿No tienes la app? Ábrelo aquí</a>
</main>
<script>
(function () {
  // Solo el numero publico de El Retorno. Nada mas vive en esta pagina.
  var PHONE = "523334864078";
  // El mensaje sale de una lista fija: nunca se usa texto de la URL tal cual.
  var MSGS = {
    fb: "Hola! Vengo de Facebook, quiero cotizar un motor.",
    ig: "Hola! Vengo de Instagram, quiero cotizar un motor.",
    def: "Hola! Quiero cotizar un motor."
  };
  var src = (new URLSearchParams(location.search).get("src") || "").toLowerCase();
  var text = encodeURIComponent(MSGS.hasOwnProperty(src) ? MSGS[src] : MSGS.def);

  var web = "https://wa.me/" + PHONE + "?text=" + text;
  var ua = navigator.userAgent || "";
  var app;
  if (/Android/i.test(ua)) {
    // intent:// abre WhatsApp o WhatsApp Business; si no hay app, cae a wa.me
    app = "intent://send/?phone=" + PHONE + "&text=" + text +
          "#Intent;scheme=whatsapp;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  } else if (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && "ontouchend" in document)) {
    app = "whatsapp://send?phone=" + PHONE + "&text=" + text;
  } else {
    app = web; // computadora: WhatsApp Web
  }

  document.getElementById("go").href = app;
  document.getElementById("web").href = web;
  location.replace(app);
})();
</script>
</body>
</html>
